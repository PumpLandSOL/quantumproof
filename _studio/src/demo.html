<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="_v.css">
<style>#stage{position:absolute;left:50px;top:30px;width:1180px;height:590px;overflow:hidden;border-radius:18px;border:1px solid rgba(255,122,24,.3);background:#050403}
#stage img{position:absolute;left:0;top:0;width:1180px;transform-origin:0 0}
#cap{position:absolute;left:50px;right:50px;top:642px;display:flex;gap:18px;align-items:baseline}#n{font-family:'JetBrains Mono';font-size:14px;color:#ff7a18}#ct{font-size:26px;font-weight:600}
#prog{position:absolute;left:0;bottom:0;height:4px;background:linear-gradient(90deg,#ffb347,#ff7a18,#ff3d00)}.full{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:#050403;z-index:9}</style>
<body><div id="stage"></div><div id="cap"><span id="n"></span><span id="ct"></span></div><div id="prog"></div>
<div class="full" id="intro"><div><div class="d" style="font-size:66px;letter-spacing:.04em">QUANTUM<span class="g">PROOF</span></div><div class="m mu" style="font-size:18px;margin-top:20px;letter-spacing:.2em">TESTNET WALKTHROUGH</div></div></div>
<div class="full" id="outro"><div><div class="d" style="font-size:50px">The chain that <span class="g">survives Q-day.</span></div><div class="m mu" style="font-size:22px;margin-top:22px">quantumproofchain.net · $QPF</div></div></div>
<script>
const $=(i)=>document.getElementById(i),cl=(x)=>Math.max(0,Math.min(1,x)),e=(x)=>{x=cl(x);return x*x*(3-2*x)};
const S=[[1.6,'01-landing','The network: live blocks, live signature count',[1.05,.3,.4]],[4.8,'05-live','Every block signed by 4 validators, each with ML-DSA-65',[1.3,.35,.5]],[8.2,'02-wallet','Generate a quantum-safe ML-DSA-44 wallet in your browser',[1.4,.3,.45]],[11.6,'03-block','Open any block: read the full 3,309-byte signatures',[1.35,.4,.6]],[15,'04-explorer','Explorer: every block and transaction, searchable',[1.15,.4,.45]],[18.2,'07-whitepaper','The 8-page whitepaper',[1.2,.5,.4]],[21.2]];
const END=21.2,DUR=23.5,W=1180,H=590,IH=1180*900/1440;
S.slice(0,-1).forEach((s,i)=>{const im=new Image();im.src='../shots/'+s[1]+'.png';im.id='i'+i;$('stage').appendChild(im);});
const tf=(z,p)=>{const s=1+(z[0]-1)*p;let x=W/2-z[1]*W*s,y=H/2-z[2]*IH*s;x=Math.min(0,Math.max(W-W*s,x));y=Math.min(0,Math.max(H-IH*s,y));return `translate(${x}px,${y}px) scale(${s})`;};
window.__seek=(t)=>{$('intro').style.opacity=1-e((t-1.2)/.4);$('outro').style.opacity=e((t-END)/.4);$('prog').style.width=(t/DUR*1280)+'px';let k=0;for(let i=0;i<S.length-1;i++)if(t>=S[i][0])k=i;
S.slice(0,-1).forEach((s,i)=>{const im=$('i'+i);im.style.opacity=i<=k?e((t-s[0])/.35):0;im.style.zIndex=i;const len=S[i+1][0]-s[0];im.style.transform=tf(s[3],e((t-s[0]-.15)/(len*.7)));});
$('n').textContent=String(k+1).padStart(2,'0')+' / 06';$('ct').textContent=S[k][2];$('cap').style.opacity=e((t-S[k][0])/.3)*(t<END?1:0);};
window.__ready=Promise.all([...document.images].map((i)=>i.decode().catch(()=>0)));window.__seek(0);
</script>
