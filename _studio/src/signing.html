<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="_v.css">
<style>.box{position:absolute;left:140px;right:140px;top:200px;height:380px;padding:30px 36px;overflow:hidden}
.hex{font-family:'JetBrains Mono';font-size:13px;line-height:1.5;word-break:break-all;color:#ffb347;margin-top:16px;height:250px;overflow:hidden}
.bar{display:flex;justify-content:space-between;font-family:'JetBrains Mono';font-size:18px}.v{display:inline-block;width:240px;margin:10px;padding:18px;text-align:left}</style>
<body><canvas id="bg" width="1280" height="720"></canvas>
<div class="c" id="s0"><div><div class="k">Under the hood</div><div class="d" style="font-size:62px;line-height:1.08;margin-top:16px">One transfer.<br><span class="g">Every step quantum-safe.</span></div></div></div>
<div id="st" style="position:absolute;inset:0"><div style="position:absolute;top:70px;left:140px;right:140px"><div class="k" id="kk"></div><div class="d" style="font-size:38px;margin-top:10px" id="tt"></div></div>
<div class="card box" id="bx"><div class="bar"><span id="lb" style="color:#ff7a18"></span><span id="ct" class="mu"></span></div><div class="hex" id="hx"></div></div>
<div id="vals" style="position:absolute;left:0;right:0;top:220px;text-align:center"></div></div>
<div class="c" id="s9"><div><div class="d" style="font-size:54px;line-height:1.12">Keys, transactions, blocks.<br><span class="g">Zero elliptic curves.</span></div><div class="m mu" style="font-size:20px;margin-top:24px">Try it live: quantumproofchain.net/wallet · $QPF</div></div></div>
<script>
const $=(i)=>document.getElementById(i),cl=(x)=>Math.max(0,Math.min(1,x)),e=(x)=>1-Math.pow(1-cl(x),3),win=(t,a,b,f=.3)=>cl((t-a)/f)*cl((b-t)/f);
let sd=7;const r=()=>(sd=(sd*16807)%2147483647)/2147483647;const hx=(n)=>Array.from({length:n},()=>'0123456789abcdef'[Math.floor(r()*16)]).join('');
const PK=hx(2624),SG=hx(4840);
const ST=[[2.4,'01 / KEYGEN','ML-DSA-44 keypair, made in your browser','public key',PK,1312],[6.4,'02 / SIGN','Your transfer, signed locally','signature',SG,2420],[10.4,'03 / VERIFY','The node checks FIPS 204 before touching state'],[13.6,'04 / FINALIZE','4 validators sign the block with ML-DSA-65'],[18]];
const VN=['Kyber','Dilithium','Falcon','Sphincs'];
const cv=$('bg'),x=cv.getContext('2d'),S=64,P=[];for(let y=-1;y<720/(S*.866)+2;y++)for(let i=-1;i<1280/S+2;i++)P.push([i*S+(y%2?S/2:0),y*S*.866]);
window.__seek=(t)=>{x.fillStyle='#050403';x.fillRect(0,0,1280,720);x.lineWidth=1;for(const[px,py]of P){x.strokeStyle=`rgba(255,122,24,${.05+.03*Math.sin(t*1.5+px*.01+py*.01)})`;x.beginPath();x.moveTo(px,py);x.lineTo(px+S,py);x.moveTo(px,py);x.lineTo(px+S/2,py+S*.866);x.moveTo(px,py);x.lineTo(px-S/2,py+S*.866);x.stroke();}
 $('s0').style.opacity=win(t,0,2.4);$('st').style.opacity=win(t,2.4,18);$('s9').style.opacity=e((t-18)/.5);
 let k=0;for(let i=0;i<4;i++)if(t>=ST[i][0])k=i;const s=ST[k],lt=t-s[0];$('kk').textContent=s[1];$('tt').innerHTML=s[2];$('tt').parentElement.style.opacity=e(lt/.3);
 if(k<2){$('bx').style.opacity=1;$('vals').innerHTML='';const f=cl(lt/3);$('lb').textContent=s[3]+' · ML-DSA-44';$('ct').innerHTML=`<span style="color:#f5efe8">${Math.floor(f*s[5]).toLocaleString()}</span> / ${s[5].toLocaleString()} bytes`;$('hx').textContent=s[4].slice(0,Math.floor(f*s[4].length));}
 else{$('bx').style.opacity=0;
  if(k===2){const ok=lt>1.4;$('vals').innerHTML=`<div class="card" style="display:inline-block;padding:40px 60px;text-align:left;font-family:'JetBrains Mono';font-size:22px;line-height:2;border-color:${ok?'rgba(77,255,154,.6)':''}">
   <div><span class="mu">algorithm </span>ML-DSA-44 · FIPS 204</div><div><span class="mu">pk </span>1,312 B <span class="mu">· sig </span>2,420 B</div><div><span class="mu">verify </span>${ok?'331 µs':'…'}</div>
   <div style="font-size:34px;margin-top:10px" class="${ok?'ok':'mu'}">${ok?'✓ VALID · applied to state':'checking'+'.'.repeat(1+Math.floor(lt*4)%3)}</div></div>`;}
  else{$('vals').innerHTML=VN.map((n,i)=>{const on=lt>.5+i*.6;return `<div class="card v" style="border-color:${on?'rgba(77,255,154,.6)':''};opacity:${e((lt-i*.15)/.3)}"><div class="d" style="font-size:24px">${n}</div><div class="m mu" style="font-size:14px;margin-top:6px">${i?'attester':'proposer'}</div><div class="m" style="font-size:13px;margin-top:10px;color:#ffb347;word-break:break-all;height:52px;overflow:hidden">${on?SG.slice(i*90,i*90+60):''}</div><div class="m ${on?'ok':'mu'}" style="font-size:15px;margin-top:8px">${on?'✓ 3,309 B ML-DSA-65':'waiting…'}</div></div>`}).join('')+`<div class="m" style="font-size:22px;margin-top:30px;opacity:${e((lt-3)/.4)}"><span class="ok">■ BLOCK FINAL</span> <span class="mu">· every 4 seconds</span></div>`;}}
};window.__seek(0);
</script>
